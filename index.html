<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behind You - Keep Walking. Stay Ahead.</title>
    <style>
        :root {
            --bg: #0B0E0F;
            --surface: #14191B;
            --border: #232B2E;
            --accent: #E5A93B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 40px 16px;
            text-align: center;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 32px;
        }
        h1 { font-size: 36px; font-weight: 8px; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
        p.tagline { font-size: 18px; color: #D1D5DB; margin-bottom: 32px; }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn {
            background: #1C2427;
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        footer { margin-top: 48px; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <h1>BEHIND YOU</h1>
        <p class="tagline">Keep walking. Stay ahead. Don't let it catch you.</p>
        <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 32px;">
            A cinematic survival game powered by your real-world walking steps. Connected with Apple HealthKit, Dynamic Island, and Live Activities.
        </p>
        <div class="links">
            <a href="privacy.html" class="btn">Privacy Policy</a>
            <a href="terms.html" class="btn">Terms of Use</a>
            <a href="support.html" class="btn">Support</a>
        </div>
        <footer>
            &copy; 2026 Behind You by Om Kadam. All rights reserved.
        </footer>
    </div>
</body>
</html>
